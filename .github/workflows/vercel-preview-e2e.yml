name: Vercel Preview E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  wait-for-preview:
    name: Wait for Vercel Preview & Run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel Preview Deployment
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: wait-for-preview
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        env:
          TENANT_APP_URL: ${{ steps.wait-for-preview.outputs.url }}
          PROVIDER_PORTAL_URL: ${{ steps.wait-for-preview.outputs.url }}
          CI: "true"
          # Use test credentials for smoke tests
          TEST_OWNER_EMAIL: "owner@test.com"
          TEST_OWNER_PASSWORD: "password123"
          TEST_PROVIDER_EMAIL: "provider@test.com"
          TEST_PROVIDER_PASSWORD: "password123"
        run: npm run test:e2e:playwright
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const previewUrl = '${{ steps.wait-for-preview.outputs.url }}';
            const comment = `## 🚀 Vercel Preview Deployment

            **Preview URL:** ${previewUrl}

            ✅ E2E smoke tests completed against this preview.

            Check the [Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed test results.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
