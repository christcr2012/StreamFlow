name: Auto-merge PRs when green

on:
  pull_request:
    types: [labeled, opened, synchronize, ready_for_review, reopened]
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  automerge:
    if: >-
      ${{ (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && (github.actor == 'christcr2012' || github.actor == 'github-actions[bot]' || github.actor == 'dependabot[bot]' || github.actor == 'Bot-Helper')) || github.event_name == 'check_suite' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait and merge without external actions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_GH_TOKEN != '' && secrets.USER_GH_TOKEN || secrets.CHRIS_GH_PAT != '' && secrets.CHRIS_GH_PAT || secrets.GH_PAT != '' && secrets.GH_PAT || secrets.BOT_HELPER_TOKEN != '' && secrets.BOT_HELPER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');
            const {owner, repo} = context.repo;

            async function getPr() {
              if (context.event_name === 'pull_request') {
                return context.payload.pull_request;
              }
              // Fallback: find latest open PR with automerge label touching this sha
              const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
              return prs.find(pr => (pr.labels || []).some(l => l.name === 'automerge')) || null;
            }

            async function checksSettled(sha) {
              // Checks API (modern)
              const runs = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: sha, per_page: 100});
              const allCompleted = runs.every(r => r.status === 'completed');
              const allSuccess = runs.every(r => ['success','neutral','skipped'].includes(r.conclusion || 'success'));
              // Statuses API (legacy contexts)
              const status = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha});
              const statusesOk = status.data.state === 'success' || status.data.state === 'pending';
              return allCompleted && allSuccess && statusesOk;
            }

            const pr = await getPr();
            if (!pr) {
              core.info('No matching PR found.');
              return;
            }
            if (pr.draft) {
              core.info(`PR #${pr.number} is draft; skip.`);
              return;
            }
            const hasLabel = (pr.labels || []).some(l => l.name === 'automerge');
            if (!hasLabel) {
              core.info(`PR #${pr.number} has no automerge label; skip.`);
              return;
            }

            const sha = pr.head.sha;
            const started = Date.now();
            const timeoutMs = 30 * 60 * 1000; // 30m
            const intervalMs = 15 * 1000;
            while (Date.now() - started < timeoutMs) {
              if (await checksSettled(sha)) break;
              await new Promise(r => setTimeout(r, intervalMs));
            }

            // Attempt merge
            try {
              await github.rest.pulls.merge({owner, repo, pull_number: pr.number, merge_method: 'squash'});
              core.info(`Merged PR #${pr.number}.`);
            } catch (e) {
              core.info(`Merge not performed: ${e.message}`);
            }

