name: DoD checklist (auto)

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      backfill:
        description: Backfill all open issues
        required: false
        default: "false"
      issue_number:
        description: Target a single issue number (optional)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  upsert-dod:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert DoD checklist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_GH_TOKEN != '' && secrets.USER_GH_TOKEN || secrets.CHRIS_GH_PAT != '' && secrets.CHRIS_GH_PAT || secrets.GH_PAT != '' && secrets.GH_PAT || secrets.BOT_HELPER_TOKEN != '' && secrets.BOT_HELPER_TOKEN || github.token }}
          script: |
            const core = require('@actions/core');
            const {owner, repo} = context.repo;
            const marker = '<!-- DOD-CHECKLIST v1 -->';
            const checklist = `${marker}
            ### Definition of Done (DoD)
            - [ ] Implementation complete and matches acceptance criteria
            - [ ] Lint, typecheck, and unit tests all passing
            - [ ] New/updated unit tests cover the change
            - [ ] Security review done (secrets, authN/Z, PII); CodeQL clean
            - [ ] CI/CD workflows updated if the change requires it
            - [ ] Docs updated (README/ops docs/CHANGELOG as appropriate)
            - [ ] UX smoke checks for any new/changed routes (no 500s; controls render; error/success states)
            `;

            async function upsertForIssue(number) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && (c.body || '').includes(marker));
              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: checklist });
                core.info(`Created DoD checklist on #${number}`);
              } else if (existing.body !== checklist) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: checklist });
                core.info(`Updated DoD checklist on #${number}`);
              } else {
                core.info(`DoD checklist already up-to-date on #${number}`);
              }
            }

            if (context.eventName === 'issues') {
              const number = context.payload.issue.number;
              if (!context.payload.issue.pull_request) {
                await upsertForIssue(number);
              } else {
                core.info('PR event detected via issues webhook; skipping.');
              }
              return;
            }

            // Manual backfill via workflow_dispatch
            const backfill = (core.getInput('backfill') || 'false').toLowerCase() === 'true';
            const issueNum = core.getInput('issue_number');
            if (issueNum) {
              await upsertForIssue(Number(issueNum));
              return;
            }
            if (backfill) {
              let page = 1; const per_page = 100;
              while (true) {
                const res = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page, page });
                const issues = res.data.filter(i => !i.pull_request);
                for (const i of issues) { await upsertForIssue(i.number); }
                if (res.data.length < per_page) break;
                page++;
              }
            } else {
              core.info('No inputs provided; nothing to do.');
            }
