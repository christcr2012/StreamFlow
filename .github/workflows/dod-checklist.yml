name: DoD checklist (manual-only)

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Backfill all open issues
        required: false
        default: "false"
      issue_number:
        description: Target a single issue or PR number (optional)
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-dod:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure DoD checklist comment exists (or update)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          MARKER='<!-- DOD-CHECKLIST v1 -->'
          read -r -d '' CHECKLIST <<'EOF'
          <!-- DOD-CHECKLIST v1 -->
          ### Definition of Done (DoD)
          - [ ] Implementation complete and matches acceptance criteria
          - [ ] Lint, typecheck, and unit tests all passing
          - [ ] New/updated unit tests cover the change
          - [ ] Security review done (secrets, authN/Z, PII); CodeQL clean
          - [ ] CI/CD workflows updated if the change requires it
          - [ ] Docs updated (README/ops docs/CHANGELOG as appropriate)
          - [ ] UX smoke checks for any new/changed routes (no 500s; controls render; error/success states)
          EOF

          upsert_for_issue() {
            local number="$1"
            local existing_id
            existing_id="$(gh api "repos/$REPO_SLUG/issues/$number/comments" --paginate --jq ".[] | select(.user.login==\"github-actions[bot]\") | select(.body | contains(\"$MARKER\")) | .id" | head -n1 || true)"
            if [ -z "${existing_id:-}" ]; then
              gh api -X POST "repos/$REPO_SLUG/issues/$number/comments" -f body="$CHECKLIST" >/dev/null
              echo "Created DoD checklist on #$number"
            else
              local body
              body="$(gh api "repos/$REPO_SLUG/issues/comments/$existing_id" --jq .body)"
              if [ "$body" != "$CHECKLIST" ]; then
                gh api -X PATCH "repos/$REPO_SLUG/issues/comments/$existing_id" -f body="$CHECKLIST" >/dev/null
                echo "Updated DoD checklist on #$number"
              else
                echo "DoD checklist already up-to-date on #$number"
              fi
            fi
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              backfill="${INPUT_BACKFILL:-false}"
              issue_num="${INPUT_ISSUE_NUMBER:-}"
              if [ -n "$issue_num" ]; then
                upsert_for_issue "$issue_num"
                exit 0
              fi
              if [ "${backfill,,}" = "true" ]; then
                gh api "repos/$REPO_SLUG/issues" -f state=open -f per_page=100 --paginate --jq '.[] | select(has("pull_request") | not) | .number' | while read -r n; do
                  upsert_for_issue "$n"
                done
                exit 0
              fi
              echo "No inputs provided; nothing to do."
              ;;
            schedule)
              gh api "repos/$REPO_SLUG/issues" -f state=open -f per_page=100 --paginate --jq '.[] | select(has("pull_request") | not) | .number' | while read -r n; do
                upsert_for_issue "$n"
              done
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              ;;
          esac
