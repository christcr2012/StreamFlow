name: Verify Projects v2 via GraphQL

on:
  workflow_dispatch: {}

permissions:
  contents: write
  repository-projects: write

jobs:
  verify-and-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Projects v2 board and Lane field (Bot-Helper)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_HELPER_TOKEN }}
          script: |
            const title = 'Cortiware – Now/Next/Later/Blocked';
            // Fetch user projects including fields
            const q = `
              query {
                viewer {
                  id
                  projectsV2(first: 50) {
                    nodes {
                      id
                      title
                      url
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2FieldCommon { id name dataType }
                          ... on ProjectV2SingleSelectField { id name options { id name } }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const res = await github.graphql(q);
            let project = res.viewer.projectsV2.nodes.find(n => n.title === title);
            if (!project) {
              const m = `
                mutation($ownerId: ID!, $title: String!) {
                  createProjectV2(input: { ownerId: $ownerId, title: $title }) {
                    projectV2 { id title url }
                  }
                }
              `;
              const created = await github.graphql(m, { ownerId: res.viewer.id, title });
              project = created.createProjectV2.projectV2;
              core.info('Created user project: ' + project.url);
            } else {
              core.info('User project exists: ' + project.url);
            }

            // Ensure Lane field exists
            const ensureFieldQuery = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2FieldCommon { id name dataType }
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                      }
                    }
                  }
                }
              }
            `;
            let fieldSnap = await github.graphql(ensureFieldQuery, { projectId: project.id });
            let laneField = (fieldSnap.node.fields.nodes || []).find(f => f && f.name === 'Lane');
            if (!laneField) {
              const mCreateField = `
                mutation($projectId: ID!, $name: String!) {
                  createProjectV2Field(input: { projectId: $projectId, dataType: SINGLE_SELECT, name: $name }) {
                    projectV2Field { __typename ... on ProjectV2FieldCommon { id name dataType } }
                  }
                }
              `;
              const createdFieldRes = await github.graphql(mCreateField, { projectId: project.id, name: 'Lane' });
              const createdField = createdFieldRes.createProjectV2Field.projectV2Field;
              laneField = { id: createdField.id, name: createdField.name };
              core.info('Created Lane field');
              fieldSnap = await github.graphql(ensureFieldQuery, { projectId: project.id });
            } else {
              core.info('Lane field exists');
            }

            // Ensure options: Now, Next, Later, Blocked
            const desired = ['Now','Next','Later','Blocked'];
            const sField = fieldSnap.node.fields.nodes.find(n => n && n.__typename === 'ProjectV2SingleSelectField' && n.id === laneField.id);
            const existingOptions = (sField?.options || []);
            const desiredSet = new Set(desired);
            const merged = [];
            for (const opt of existingOptions) {
              if (desiredSet.has(opt.name)) {
                merged.push({ id: opt.id, name: opt.name });
                desiredSet.delete(opt.name);
              }
            }
            for (const name of desiredSet) {
              merged.push({ name });
            }
            if (merged.length) {
              const mUpdate = `
                mutation($projectId: ID!, $fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                  updateProjectV2SingleSelectField(input: { projectId: $projectId, fieldId: $fieldId, options: $options }) {
                    projectV2SingleSelectField { id name options { id name } }
                  }
                }
              `;
              const upd = await github.graphql(mUpdate, { projectId: project.id, fieldId: laneField.id, options: merged });
              core.info('Lane options now: ' + upd.updateProjectV2SingleSelectField.projectV2SingleSelectField.options.map(o => o.name).join(', '));
            } else {
              core.info('Lane options already match desired set.');
            }

            // Write docs/PROJECTS.md
            const fs = require('fs');
            fs.mkdirSync('docs', { recursive: true });
            fs.writeFileSync('docs/PROJECTS.md', `# Projects v2 Board\n\nURL: ${project.url}\n`);


      - name: Commit project link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECTS.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: add Projects v2 board link (auto)"
            git push
          fi

