name: Verify Projects v2 via GraphQL

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify-and-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query GraphQL and ensure a Projects v2 board exists
        id: gql
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_HELPER_TOKEN }}
          script: |
            const title = 'Cortiware – Now/Next/Later/Blocked';
            const q = `
              query {
                viewer {
                  id
                  login
                  projectsV2(first: 20) { nodes { id title url } }
                }
              }
            `;
            const res = await github.graphql(q);
            core.info('GraphQL query succeeded');
            core.info(JSON.stringify(res, null, 2));

            let project = res.viewer.projectsV2.nodes.find(n => n.title === title);
            if (!project) {
              const m = `
                mutation($ownerId: ID!, $title: String!) {
                  createProjectV2(input: { ownerId: $ownerId, title: $title }) {
                    projectV2 { id title url }
                  }
                }
              `;
              const created = await github.graphql(m, { ownerId: res.viewer.id, title });
              project = created.createProjectV2.projectV2;
              core.info('Created project: ' + project.url);
            } else {
              core.info('Project exists: ' + project.url);
            }

            core.setOutput('project_url', project.url);


      - name: Ensure Lane field with options
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_HELPER_TOKEN }}
          script: |
            const title = 'Cortiware – Now/Next/Later/Blocked';
            // Fetch project and fields with fragments
            const q = `
              query {
                viewer {
                  projectsV2(first: 50) {
                    nodes {
                      id
                      title
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2FieldCommon { id name dataType }
                          ... on ProjectV2SingleSelectField { id name options { id name } }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const res = await github.graphql(q);
            const project = res.viewer.projectsV2.nodes.find(n => n.title === title);
            if (!project) throw new Error('Project not found: ' + title);

            // Find or create Lane field
            let laneField = (project.fields.nodes || []).find(f => f && f.name === 'Lane');
            if (!laneField) {
              const mCreateField = `
                mutation($projectId: ID!, $name: String!) {
                  createProjectV2Field(input: { projectId: $projectId, dataType: SINGLE_SELECT, name: $name }) {
                    projectV2Field {
                      __typename
                      ... on ProjectV2FieldCommon { id name dataType }
                    }
                  }
                }
              `;
              const created = await github.graphql(mCreateField, { projectId: project.id, name: 'Lane' });
              const createdField = created.createProjectV2Field.projectV2Field;
              laneField = { id: createdField.id, name: createdField.name };
              core.info('Created Lane field');
            } else {
              core.info('Lane field exists');
            }

            // Ensure options exist: Now, Next, Later, Blocked
            const desired = ['Now','Next','Later','Blocked'];
            // Refresh field details to read options
            const qField = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                      }
                    }
                  }
                }
              }
            `;
            const fieldRes = await github.graphql(qField, { projectId: project.id });
            const sField = fieldRes.node.fields.nodes.find(n => n && n.__typename === 'ProjectV2SingleSelectField' && n.id === laneField.id);
            const existingOptions = (sField?.options || []);
            const desiredSet = new Set(desired);
            const merged = [];
            for (const opt of existingOptions) {
              if (desiredSet.has(opt.name)) {
                merged.push({ id: opt.id, name: opt.name });
                desiredSet.delete(opt.name);
              }
            }
            for (const name of desiredSet) {
              merged.push({ name });
            }

            const mUpdate = `
              mutation($projectId: ID!, $fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) {
                updateProjectV2SingleSelectField(input: { projectId: $projectId, fieldId: $fieldId, options: $options }) {
                  projectV2SingleSelectField { id name options { id name } }
                }
              }
            `;
            const upd = await github.graphql(mUpdate, { projectId: project.id, fieldId: laneField.id, options: merged });
            core.info('Lane options now: ' + upd.updateProjectV2SingleSelectField.projectV2SingleSelectField.options.map(o => o.name).join(', '));

      - name: Write project link to docs
        run: |
          echo "# Projects v2 Board" > docs/PROJECTS.md
          echo >> docs/PROJECTS.md
          echo "URL: ${{ steps.gql.outputs.project_url }}" >> docs/PROJECTS.md

      - name: Commit project link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECTS.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: add Projects v2 board link (auto)"
            git push
          fi

