name: Neon Preview Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  pull_request_review:
    types: [submitted]

env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

jobs:
  create-preview-branch:
    name: Create Neon Preview Branch
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Neon CLI
        run: |
          curl -fsSL https://neon.tech/install.sh | bash
          echo "$HOME/.neon/bin" >> $GITHUB_PATH
      
      - name: Create Neon branch
        id: create-branch
        run: |
          # Create branch name from PR number
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          
          # Create Neon branch from main
          neon branches create \
            --project-id $NEON_PROJECT_ID \
            --name $BRANCH_NAME \
            --parent main \
            --output json > branch.json
          
          # Extract connection string
          CONNECTION_STRING=$(cat branch.json | jq -r '.connection_uri')
          
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          
          # Comment on PR with branch info
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🌿 Neon preview branch created: \`$BRANCH_NAME\`"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run migrations
        run: |
          export DATABASE_URL="${{ steps.create-branch.outputs.connection_string }}"
          npx prisma migrate deploy
      
      - name: Seed sample data
        run: |
          export DATABASE_URL="${{ steps.create-branch.outputs.connection_string }}"
          npm run db:seed:preview
      
      - name: Update Vercel preview environment
        run: |
          # Install Vercel CLI
          npm i -g vercel
          
          # Set DATABASE_URL for preview deployment
          vercel env add DATABASE_URL preview \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --value "${{ steps.create-branch.outputs.connection_string }}"
      
      - name: Comment PR with preview info
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "✅ Preview environment ready!
          
          **Database**: \`pr-${{ github.event.pull_request.number }}\`
          **Migrations**: Applied
          **Sample Data**: Seeded
          
          The next Vercel preview deployment will use this database."
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup-preview-branch:
    name: Cleanup Neon Preview Branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event.action == 'closed'
    
    steps:
      - name: Install Neon CLI
        run: |
          curl -fsSL https://neon.tech/install.sh | bash
          echo "$HOME/.neon/bin" >> $GITHUB_PATH
      
      - name: Delete Neon branch
        run: |
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          
          # Delete the branch
          neon branches delete \
            --project-id $NEON_PROJECT_ID \
            --name $BRANCH_NAME \
            --force || echo "Branch may not exist"
      
      - name: Comment on PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🧹 Neon preview branch \`pr-${{ github.event.pull_request.number }}\` has been deleted."
        env:
          GH_TOKEN: ${{ github.token }}

