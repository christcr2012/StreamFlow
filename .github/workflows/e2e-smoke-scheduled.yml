name: E2E Smoke (Scheduled)

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (defaults to staging)"
        required: false
        default: ""

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve BASE_URL
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE_URL:-}"
          staging="$(gh variable get STAGING_URL -R "$REPO_SLUG" 2>/dev/null || true)"
          if [ -n "$base" ]; then
            url="$base"
          elif [ -n "$staging" ]; then
            url="$staging"
          else
            url="https://cortiware-provider-portal-git-main-chris-projects-de6cd1bf.vercel.app"
          fi
          echo "BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Run E2E Smoke
        env:
          E2E_EXPECT_FED_ENABLED: "true"
        run: npm run test:e2e

