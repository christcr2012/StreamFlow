name: Performance Monitoring

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      compare_against:
        description: 'Baseline file to compare against (optional)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  performance_check:
    if: >-
      ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && (github.actor == 'christcr2012' || github.actor == 'github-actions[bot]' || github.actor == 'dependabot[bot]' || github.actor == 'Bot-Helper')) }}
    name: Performance Regression Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Generate Prisma Clients
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=apps/provider-portal/prisma/schema.prisma
      
      - name: Check for existing baseline
        id: check_baseline
        run: |
          if [ -f "scripts/performance/baseline.json" ]; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Measure current performance
        run: npm run perf:measure
        continue-on-error: true
      
      - name: Compare against baseline
        if: steps.check_baseline.outputs.baseline_exists == 'true'
        run: npm run perf:compare
        continue-on-error: true
      
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            scripts/performance/baseline.json
            scripts/performance/current.json
            scripts/performance/results/*.json
          retention-days: 30
      
      - name: Write results to job summary (no PR comments)
        if: steps.check_baseline.outputs.baseline_exists == 'true'
        run: |
          node -e "const fs=require('fs'); let out='## 📊 Performance Comparison\n\n'; try{const baseline=JSON.parse(fs.readFileSync('scripts/performance/baseline.json','utf-8')); const current=JSON.parse(fs.readFileSync('scripts/performance/current.json','utf-8')); out+=`**Baseline**: ${baseline.timestamp}\n**Current**: ${current.timestamp}\n\n### Results\n\n| App | Bundle Size | Build Time |\n|-----|-------------|------------|\n`; for (const [app, m] of Object.entries(current.apps)) { const b=baseline.apps[app]; if(!b) continue; const bundle=m.bundleSize.total!==b.bundleSize.total?`${b.bundleSize.total} → ${m.bundleSize.total}`:m.bundleSize.total; const build=m.buildTime.duration!==b.buildTime.duration?`${b.buildTime.duration} → ${m.buildTime.duration}`:m.buildTime.duration; out+=`| ${app} | ${bundle} | ${build} |\n`; } } catch(e){ out+=`⚠️ Could not generate comparison: ${e.message}`; } fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);"
