name: Auto-triage issues (manual-only)

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label by title keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const number = context.payload.issue.number;
            const labels = new Set();

            // Type
            if (title.includes('bug') || title.includes('fix')) labels.add('type: bug');
            if (title.includes('feat') || title.includes('feature')) labels.add('type: feature');
            if (title.includes('doc')) labels.add('docs');
            if (title.includes('ci')) labels.add('ci');
            if (title.includes('chore') || title.includes('task')) labels.add('type: chore');

            // Priority by common words
            if (title.includes('now') || title.includes('urgent') || title.includes('blocker')) labels.add('priority: now');
            else if (title.includes('next') || title.includes('soon')) labels.add('priority: next');
            else if (title.includes('later') || title.includes('someday')) labels.add('priority: later');

            if (labels.size) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                labels: Array.from(labels)
              });
            }

