name: Sync Issues to Projects v2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '29 7 * * *'
  issues:
    types: [opened, edited, milestoned, demilestoned, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure issues exist in Projects v2 and set Lane
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_HELPER_TOKEN }}
          script: |
            const title = 'Cortiware – Now/Next/Later/Blocked';
            const mapMilestoneToLane = (ms) => {
              if (!ms) return 'Later';
              const t = ms.title.toLowerCase();
              if (t.includes('now')) return 'Now';
              if (t.includes('next')) return 'Next';
              if (t.includes('blocked')) return 'Blocked';
              return 'Later';
            };

            // Fetch viewer projects and find our board
            const qProj = `query { viewer { id login projectsV2(first: 50) { nodes { id title url fields(first: 20) { nodes { id name dataType ... on ProjectV2SingleSelectField { options { id name } } } } } } } }`;
            const projRes = await github.graphql(qProj);
            const viewer = projRes.viewer;
            const project = viewer.projectsV2.nodes.find(n => n.title === title);
            if (!project) throw new Error('Project not found: ' + title);

            // Ensure Lane field exists (single-select)
            let laneField = project.fields.nodes.find(f => f.name === 'Lane' && f.dataType === 'SINGLE_SELECT');
            if (!laneField) {
              const mCreateField = `mutation($projectId: ID!) { createProjectV2Field(input:{ projectId: $projectId, dataType: SINGLE_SELECT, name: "Lane", options: [{name:"Now"},{name:"Next"},{name:"Later"},{name:"Blocked"}] }) { projectV2Field { id } } }`;
              const created = await github.graphql(mCreateField, { projectId: project.id });
              laneField = { id: created.createProjectV2Field.projectV2Field.id };
              // Re-query options to get ids
              const projRes2 = await github.graphql(qProj);
              const project2 = projRes2.viewer.projectsV2.nodes.find(n => n.title === title);
              laneField = project2.fields.nodes.find(f => f.name === 'Lane');
            }
            const options = (laneField.options || []).reduce((acc, o) => { acc[o.name] = o.id; return acc; }, {});

            // Get issues to process
            const { owner, repo } = context.repo;
            let issues = [];
            if (context.eventName === 'issues') {
              // Single issue from event
              const i = context.payload.issue;
              issues = [i];
            } else {
              // Full sync: open issues only
              issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            }

            // Helper: ensure item exists
            const mAdd = `mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input:{ projectId: $projectId, contentId: $contentId }) { item { id } } }`;
            const qItem = `query($projectId: ID!, $contentId: ID!) { node(id: $contentId) { ... on Issue { id projectItems: projectV2(project: $projectId) { id } } } }`;
            const mSet = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) { updateProjectV2ItemFieldValue(input:{ projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: { singleSelectOptionId: $optionId } }) { projectV2Item { id } } }`;

            for (const i of issues) {
              // Get node id and milestone
              const issueQ = `query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo){ issue(number:$number){ id milestone { title } projectItems: projectsV2(first: 50) { nodes { id project { id title } } } } } }`;
              const issueRes = await github.graphql(issueQ, { owner, repo, number: i.number });
              const issueNode = issueRes.repository.issue;
              const lane = mapMilestoneToLane(issueNode.milestone);

              // If not in project, add
              const inProject = issueNode.projectItems.nodes.some(n => n.project.id === project.id);
              let itemId = null;
              if (!inProject) {
                const added = await github.graphql(mAdd, { projectId: project.id, contentId: issueNode.id });
                itemId = added.addProjectV2ItemById.item.id;
              } else {
                // Fetch item id via separate query
                const qItems = `query($projectId: ID!, $issueId: ID!) { node(id:$issueId){ ... on Issue { projectItems: projectV2Items(first:50){ nodes { id project { id } } } } } }`;
                const itemsRes = await github.graphql(qItems, { projectId: project.id, issueId: issueNode.id });
                const match = itemsRes.node.projectItems.nodes.find(n => n.project.id === project.id);
                itemId = match ? match.id : null;
              }

              if (itemId) {
                const optionId = options[lane] || options['Later'];
                await github.graphql(mSet, { projectId: project.id, itemId, fieldId: laneField.id, optionId });
              }
            }
            core.info(`Synced ${issues.length} issue(s) to project ${project.url}`);

