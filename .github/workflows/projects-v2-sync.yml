name: Sync Issues to Projects v2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '29 7 * * *'
  issues:
    types: [opened, edited, milestoned, demilestoned, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: read
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure issues exist in Projects v2 and set Lane
        uses: actions/github-script@v7
        env:
          BOT_HELPER_TOKEN: ${{ secrets.BOT_HELPER_TOKEN }}
        with:
          github-token: ${{ env.BOT_HELPER_TOKEN }}
          script: |
            const title = 'Cortiware – Now/Next/Later/Blocked';
            const getLane = (issue, labels) => {
              if (issue && issue.milestone) {
                const t = (issue.milestone.title || '').toLowerCase();
                if (t.includes('now')) return 'Now';
                if (t.includes('next')) return 'Next';
                if (t.includes('blocked')) return 'Blocked';
                if (t.includes('later')) return 'Later';
              }
              const names = (labels || []).map(l => (l.name || '').toLowerCase());
              if (names.includes('priority: now')) return 'Now';
              if (names.includes('priority: next')) return 'Next';
              if (names.includes('priority: later')) return 'Later';
              if (names.includes('blocked')) return 'Blocked';
              return 'Later';
            };

            // Fetch user projects and find our board (Bot-Helper)
            const qProj = `
              query {
                viewer {
                  id
                  projectsV2(first: 50) {
                    nodes {
                      id
                      title
                      url
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2FieldCommon { id name dataType }
                          ... on ProjectV2SingleSelectField { id name options { id name } }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const projRes = await github.graphql(qProj);
            const project = projRes.viewer.projectsV2.nodes.find(n => n.title === title);
            if (!project) throw new Error('Project not found: ' + title);

            // Try to read existing Lane field (optional). If missing, we still add items without setting Lane.
            const getLaneField = (proj) => (proj.fields.nodes || []).find(f => f && f.name === 'Lane');
            const laneField = getLaneField(project);
            const laneOptions = (laneField && laneField.options) ? laneField.options : [];
            const options = (laneOptions || []).reduce((acc, o) => { acc[o.name] = o.id; return acc; }, {});

            // Get issues to process
            let issues = [];
            if (context.eventName === 'issues') {
              // Single issue from event
              const i = context.payload.issue;
              issues = [i];
            } else {
              // Full sync: open issues only (exclude PRs)
              issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              issues = issues.filter(i => !i.pull_request);
            }

            // Helper: ensure item exists
            const mAdd = `mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input:{ projectId: $projectId, contentId: $contentId }) { item { id } } }`;
            const qItem = `query($projectId: ID!, $contentId: ID!) { node(id: $contentId) { ... on Issue { id projectItems: projectV2(project: $projectId) { id } } } }`;
            const mSet = `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) { updateProjectV2ItemFieldValue(input:{ projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: { singleSelectOptionId: $optionId } }) { projectV2Item { id } } }`;

            for (const i of issues) {
              try {
                // Get node id and milestone
                const issueQ = `query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo){ issue(number:$number){ id milestone { title } } } }`;
                const issueRes = await github.graphql(issueQ, { owner, repo, number: i.number });
                const issueNode = issueRes.repository.issue;
                const lane = getLane(issueNode, i.labels);

                // Add to project (idempotent): if already present, fetch existing item id
                let itemId = null;
                try {
                  const added = await github.graphql(mAdd, { projectId: project.id, contentId: issueNode.id });
                  itemId = added.addProjectV2ItemById.item.id;
                } catch (e) {
                  // Fallback: fetch existing items for this issue
                  const qItems = `query($issueId: ID!) { node(id:$issueId){ ... on Issue { projectItems: projectV2Items(first:50){ nodes { id } } } } }`;
                  const itemsRes = await github.graphql(qItems, { issueId: issueNode.id });
                  itemId = itemsRes.node?.projectItems?.nodes?.[0]?.id || null;
                }

                // Optionally set Lane when field/options are available
                if (itemId && laneField && Object.keys(options).length) {
                  const optionId = options[lane] || options['Later'];
                  if (optionId) {
                    await github.graphql(mSet, { projectId: project.id, itemId, fieldId: laneField.id, optionId });
                  }
                }
              } catch (err) {
                core.warning(`Skipped #${i.number}: ${err.message || err}`);
              }
            }
            core.info(`Synced ${issues.length} issue(s) to project ${project.url}`);

