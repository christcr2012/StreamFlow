name: DoD checklist backfill

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Target a single issue or PR number (optional)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill DoD checklist comments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const MARKER = '<!-- DOD-CHECKLIST v1 -->';
            const CHECKLIST = `${MARKER}\n### Definition of Done (DoD)\n- [ ] Implementation complete and matches acceptance criteria\n- [ ] Lint, typecheck, and unit tests all passing\n- [ ] New/updated unit tests cover the change\n- [ ] Security review done (secrets, authN/Z, PII); CodeQL clean\n- [ ] CI/CD workflows updated if the change requires it\n- [ ] Docs updated (README/ops docs/CHANGELOG as appropriate)\n- [ ] UX smoke checks for any new/changed routes (no 500s; controls render; error/success states)\n`;

            async function upsert(number) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const existing = comments.find(c => (c.body || '').includes(MARKER));
              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: CHECKLIST });
                core.info(`Created DoD checklist on #${number}`);
              } else if ((existing.body || '') !== CHECKLIST) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: CHECKLIST });
                core.info(`Updated DoD checklist on #${number}`);
              } else {
                core.info(`Already up-to-date on #${number}`);
              }
            }

            const inputs = context.payload.inputs || {};
            const one = inputs.issue_number ? Number(inputs.issue_number) : null;
            if (one) {
              await upsert(one);
              return;
            }
            // Iterate all open issues (exclude PRs)
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            for (const iss of issues) {
              if (!iss.pull_request) {
                await upsert(iss.number);
              }
            }
            core.info('Backfill complete.');

