name: Setup Repository Secrets

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel Token'
        required: true
        type: string
      vercel_org_id:
        description: 'Vercel Org ID'
        required: true
        type: string
        default: 'team_PUafLQmqT7LYBaBs8lEOPYMG'
      neon_api_key:
        description: 'Neon API Key'
        required: true
        type: string
      neon_project_id:
        description: 'Neon Project ID'
        required: true
        type: string
        default: 'ep-billowing-truth-afi1gfga'
      github_pat:
        description: 'GitHub Personal Access Token'
        required: false
        type: string
      redis_url:
        description: 'Redis Connection String'
        required: false
        type: string
      resend_key:
        description: 'Resend API Key'
        required: false
        type: string
      twilio_sid:
        description: 'Twilio Account SID'
        required: false
        type: string
      twilio_token:
        description: 'Twilio Auth Token'
        required: false
        type: string
      cloudflare_token:
        description: 'Cloudflare API Token'
        required: false
        type: string

jobs:
  setup-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup secrets using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔐 Setting up repository secrets..."
          
          # Vercel secrets
          echo "Setting VERCEL_TOKEN..."
          echo "${{ github.event.inputs.vercel_token }}" | gh secret set VERCEL_TOKEN
          
          echo "Setting VERCEL_ORG_ID..."
          echo "${{ github.event.inputs.vercel_org_id }}" | gh secret set VERCEL_ORG_ID
          
          # Neon secrets
          echo "Setting NEON_API_KEY..."
          echo "${{ github.event.inputs.neon_api_key }}" | gh secret set NEON_API_KEY
          
          echo "Setting NEON_PROJECT_ID..."
          echo "${{ github.event.inputs.neon_project_id }}" | gh secret set NEON_PROJECT_ID
          
          # Optional secrets (only set if provided)
          if [ -n "${{ github.event.inputs.github_pat }}" ]; then
            echo "Setting GITHUB_PERSONAL_ACCESS_TOKEN..."
            echo "${{ github.event.inputs.github_pat }}" | gh secret set GITHUB_PERSONAL_ACCESS_TOKEN
          fi
          
          if [ -n "${{ github.event.inputs.redis_url }}" ]; then
            echo "Setting REDIS_CONNECTION_STRING..."
            echo "${{ github.event.inputs.redis_url }}" | gh secret set REDIS_CONNECTION_STRING
          fi
          
          if [ -n "${{ github.event.inputs.resend_key }}" ]; then
            echo "Setting RESEND_API_KEY..."
            echo "${{ github.event.inputs.resend_key }}" | gh secret set RESEND_API_KEY
          fi
          
          if [ -n "${{ github.event.inputs.twilio_sid }}" ]; then
            echo "Setting TWILIO_ACCOUNT_SID..."
            echo "${{ github.event.inputs.twilio_sid }}" | gh secret set TWILIO_ACCOUNT_SID
          fi
          
          if [ -n "${{ github.event.inputs.twilio_token }}" ]; then
            echo "Setting TWILIO_AUTH_TOKEN..."
            echo "${{ github.event.inputs.twilio_token }}" | gh secret set TWILIO_AUTH_TOKEN
          fi
          
          if [ -n "${{ github.event.inputs.cloudflare_token }}" ]; then
            echo "Setting CLOUDFLARE_API_TOKEN..."
            echo "${{ github.event.inputs.cloudflare_token }}" | gh secret set CLOUDFLARE_API_TOKEN
          fi
          
          echo "✅ All secrets have been set successfully!"
          
      - name: Verify secrets were set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📋 Listing all repository secrets:"
          gh secret list
          
      - name: Cleanup - Delete this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 This workflow has completed its purpose."
          echo "You can safely delete .github/workflows/setup-secrets.yml now."
          echo "Or run: git rm .github/workflows/setup-secrets.yml && git commit -m 'chore: remove one-time secrets setup workflow' && git push"
