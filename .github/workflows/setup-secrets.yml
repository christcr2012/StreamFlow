name: Setup Repository Secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "CONFIRM" to proceed with setting secrets'
        required: true
        type: string

jobs:
  setup-secrets:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CONFIRM'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read secrets from config file
        id: read-secrets
        run: |
          echo "🔐 Reading secrets from mcp-config.json..."
          
          # Extract secrets from mcp-config.json
          VERCEL_TOKEN=$(jq -r '.mcpServers."vercel-robinsonai".args[1]' mcp-config.json)
          NEON_API_KEY=$(jq -r '.mcpServers."neon-robinsonai".args[2]' mcp-config.json)
          GITHUB_PAT=$(jq -r '.mcpServers."github-robinsonai".env.GITHUB_PERSONAL_ACCESS_TOKEN' mcp-config.json)
          REDIS_URL=$(jq -r '.mcpServers."redis-robinsonai".args[1]' mcp-config.json)
          RESEND_KEY=$(jq -r '.mcpServers."resend-cortiware".env.RESEND_API_KEY' mcp-config.json)
          TWILIO_SID=$(jq -r '.mcpServers."twilio-cortiware".env.TWILIO_ACCOUNT_SID' mcp-config.json)
          TWILIO_TOKEN=$(jq -r '.mcpServers."twilio-cortiware".env.TWILIO_AUTH_TOKEN' mcp-config.json)
          CF_TOKEN=$(jq -r '.mcpServers."cloudflare-cortiware".env.CLOUDFLARE_API_TOKEN' mcp-config.json)
          
          # Store in environment for next step
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> $GITHUB_ENV
          echo "NEON_API_KEY=$NEON_API_KEY" >> $GITHUB_ENV
          echo "GITHUB_PAT=$GITHUB_PAT" >> $GITHUB_ENV
          echo "REDIS_URL=$REDIS_URL" >> $GITHUB_ENV
          echo "RESEND_KEY=$RESEND_KEY" >> $GITHUB_ENV
          echo "TWILIO_SID=$TWILIO_SID" >> $GITHUB_ENV
          echo "TWILIO_TOKEN=$TWILIO_TOKEN" >> $GITHUB_ENV
          echo "CF_TOKEN=$CF_TOKEN" >> $GITHUB_ENV

      - name: Setup secrets using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔐 Setting up repository secrets..."
          
          # Vercel secrets
          echo "Setting VERCEL_TOKEN..."
          echo "$VERCEL_TOKEN" | gh secret set VERCEL_TOKEN
          
          echo "Setting VERCEL_ORG_ID..."
          echo "team_PUafLQmqT7LYBaBs8lEOPYMG" | gh secret set VERCEL_ORG_ID
          
          # Neon secrets
          echo "Setting NEON_API_KEY..."
          echo "$NEON_API_KEY" | gh secret set NEON_API_KEY
          
          echo "Setting NEON_PROJECT_ID..."
          echo "ep-billowing-truth-afi1gfga" | gh secret set NEON_PROJECT_ID
          
          # GitHub PAT for MCP
          echo "Setting GITHUB_PERSONAL_ACCESS_TOKEN..."
          echo "$GITHUB_PAT" | gh secret set GITHUB_PERSONAL_ACCESS_TOKEN
          
          # Redis connection string
          echo "Setting REDIS_CONNECTION_STRING..."
          echo "$REDIS_URL" | gh secret set REDIS_CONNECTION_STRING
          
          # Resend API key
          echo "Setting RESEND_API_KEY..."
          echo "$RESEND_KEY" | gh secret set RESEND_API_KEY
          
          # Twilio credentials
          echo "Setting TWILIO_ACCOUNT_SID..."
          echo "$TWILIO_SID" | gh secret set TWILIO_ACCOUNT_SID
          
          echo "Setting TWILIO_AUTH_TOKEN..."
          echo "$TWILIO_TOKEN" | gh secret set TWILIO_AUTH_TOKEN
          
          # Cloudflare API token
          echo "Setting CLOUDFLARE_API_TOKEN..."
          echo "$CF_TOKEN" | gh secret set CLOUDFLARE_API_TOKEN
          
          echo "✅ All secrets have been set successfully!"
          
      - name: Verify secrets were set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📋 Listing all repository secrets:"
          gh secret list
          
      - name: Cleanup - Delete this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 This workflow has completed its purpose."
          echo "You can safely delete .github/workflows/setup-secrets.yml now."
          echo "Or run: git rm .github/workflows/setup-secrets.yml && git commit -m 'chore: remove one-time secrets setup workflow' && git push"
