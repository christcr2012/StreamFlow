name: Auto-approve and label trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  approve-and-label:
    if: >-
      ${{ !github.event.pull_request.head.repo.fork && (github.actor == 'christcr2012' || github.actor == 'Bot-Helper' || github.actor == 'github-actions[bot]' || github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR and add automerge label (first-party)
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_GH_TOKEN != '' && secrets.USER_GH_TOKEN || secrets.CHRIS_GH_PAT != '' && secrets.CHRIS_GH_PAT || secrets.GH_PAT != '' && secrets.GH_PAT || secrets.BOT_HELPER_TOKEN != '' && secrets.BOT_HELPER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const number = context.payload.pull_request.number;
            // Approve PR
            await github.rest.pulls.createReview({ owner, repo, pull_number: number, event: 'APPROVE' });
            // Add automerge label
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['automerge'] });

