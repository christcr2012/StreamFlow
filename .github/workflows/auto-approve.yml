name: Auto-approve and label trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  approve-and-label:
    if: >-
      ${{ github.actor == 'christcr2012' || github.actor == 'Bot-Helper' || github.actor == 'github-actions[bot]' || github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR as Bot-Helper
        if: ${{ !github.event.pull_request.draft }}
        env:
          GH_TOKEN: ${{ secrets.BOT_HELPER_TOKEN }}
        run: |
          set -e
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            -d '{"event":"APPROVE"}'

      - name: Add automerge label
        env:
          GH_TOKEN: ${{ secrets.BOT_HELPER_TOKEN }}
        run: |
          set -e
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            -d '{"labels":["automerge"]}'

