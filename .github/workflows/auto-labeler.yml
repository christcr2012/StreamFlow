name: Auto-label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: >-
      ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && (github.actor == 'christcr2012' || github.actor == 'github-actions[bot]' || github.actor == 'dependabot[bot]' || github.actor == 'Bot-Helper')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

