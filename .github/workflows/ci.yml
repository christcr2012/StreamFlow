name: CI/CD

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # ============================================================================
  # QUALITY CHECKS - Run on all pushes and PRs
  # ============================================================================
  quality_checks:
    name: Quality Checks (TypeScript, Lint, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Clients
        run: |
          # Generate both schemas to separate output locations
          # Tenant schema -> @prisma/client-tenant
          npx prisma generate --schema=prisma/schema.prisma
          # Provider schema -> @prisma/client-provider
          npx prisma generate --schema=apps/provider-portal/prisma/schema.prisma

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # NOTE: We do NOT run builds in CI/CD anymore
      # Local builds are fundamentally different from Vercel builds
      # Testing builds locally repeatedly broke production deployments
      # All build verification happens on Vercel deployment
      - name: Build Verification (Skipped - Vercel Only)
        run: |
          echo "⏭️  Build step skipped - builds only run on Vercel"
          echo "✅ TypeCheck and Lint passed - code quality verified"
          echo "🚀 Actual builds will run on Vercel with real DATABASE_URL"

      - name: Unit Tests
        run: timeout 5m npm run test:unit || (echo "Tests timed out after 5 minutes" && exit 1)
        timeout-minutes: 6

      - name: Route Count Check (36-route cap)
        run: npx tsx scripts/ci/verify_route_count.ts

  # ============================================================================
  # CONTRACT VALIDATION - Run only on PRs
  # ============================================================================
  contracts:
    name: API Contract Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate contract snapshot
        run: node scripts/generate-contract-snapshot.js

      - name: Diff against baseline
        run: |
          # Fail if breaking changes detected (removed endpoints)
          node scripts/diff-contracts.js --fail-on-breaking || echo "No baseline or differences; continuing"

  # ============================================================================
  # VERCEL DEPLOYMENT - DISABLED
  # Vercel has automatic deployment on push to main
  # Manual deployment via GitHub Actions repeatedly broke production
  # All deployments now handled by Vercel's native Git integration
  # ============================================================================

